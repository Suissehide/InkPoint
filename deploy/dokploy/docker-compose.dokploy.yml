name: inkpoint

services:
  front:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: app
      args:
        NODE_VERSION: ${NODE_VERSION}
        # Le front l'inline au build (Vite) — sans lui, le bundle livré cible
        # `http://localhost:3000` en silence (voir `deploy/Dockerfile`).
        VITE_API_URL: 'https://${TRAEFIK_API_HOST}'
    image: ${APP_IMAGE_NAME}-front:${VERSION:-latest}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - inkpoint-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  back:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.back
      args:
        NODE_VERSION: ${NODE_VERSION}
    image: ${APP_IMAGE_NAME}-back:${VERSION:-latest}
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      CORS_ORIGIN: 'https://${TRAEFIK_FRONT_HOST}'
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    # Sans ça, `restart: unless-stopped` ne redémarre jamais un conteneur qui
    # a perdu sa base : `back` continue de tourner et de répondre 503 à
    # `/health` (voir sa docstring) sans que Docker n'agisse jamais dessus.
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  inkpoint-pgdata:
