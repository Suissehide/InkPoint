name: inkpoint

networks:
  proxy:
    name: proxy
    external: true

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
      args:
        NODE_VERSION: ${NODE_VERSION}
    image: '${CONTAINER_REGISTRY_PREFIX}${APP_IMAGE_NAME}:${VERSION:-latest}'
    container_name: '${APP_IMAGE_NAME}'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.${APP_IMAGE_NAME}.rule=Host(`${TRAEFIK_HOST}`)'
      - 'traefik.http.routers.${APP_IMAGE_NAME}.entrypoints=https'
      - 'traefik.http.routers.${APP_IMAGE_NAME}.tls=true'
      - 'traefik.http.routers.${APP_IMAGE_NAME}.tls.certresolver=ovh'
      - 'traefik.http.services.${APP_IMAGE_NAME}.loadbalancer.server.port=80'
    networks:
      - proxy
    restart: unless-stopped
