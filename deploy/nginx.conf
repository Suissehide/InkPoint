server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sans ça, `text/plain` et `text/xml` partent sans paramètre `charset` : les
    # accents s'affichent en mojibake, et un `text/xml` nu vaut officiellement de
    # l'us-ascii (RFC 7303), qui l'emporte sur l'`encoding` déclaré dans le fichier.
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets hachés par Vite : immuables, cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache, sinon un déploiement
    # sert d'anciens noms d'assets et la page casse.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # `=404` et non le repli `/index.html` des SPA : le jeu n'a aucune route
    # côté client, ce repli répondait donc 200 à n'importe quelle URL. `$uri/`
    # reste nécessaire, c'est lui qui fait tomber `/` sur la directive `index`.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # `internal` : sans lui, `/404.html` demandée directement répondrait 200 —
    # une page d'erreur indexable en « tout va bien ».
    location = /404.html {
        internal;
    }
}
