server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sans ça, nginx sert `text/plain` et `text/xml` SANS paramètre `charset`,
    # et les accents de `robots.txt` s'affichent en mojibake. Ce n'est pas que
    # cosmétique pour `sitemap.xml` : un `text/xml` sans `charset` vaut de
    # l'us-ascii (RFC 7303), qui l'emporte sur l'`encoding="UTF-8"` déclaré
    # DANS le fichier. La directive couvre `charset_types`, dont `text/plain`
    # et `text/xml` font partie par défaut ; elle ne réencode rien tant que
    # `source_charset` n'est pas défini, elle ne fait qu'annoncer la vérité.
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets hachés par Vite : immuables, cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache, sinon un déploiement
    # sert d'anciens noms d'assets et la page casse.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # `=404` et non le repli `/index.html` habituel des SPA : le jeu n'a AUCUNE
    # route côté client, une seule adresse. Le repli ne rattrapait donc rien, il
    # se contentait de répondre 200 avec la page d'accueil à n'importe quelle
    # URL — des « soft 404 » pour Google, et surtout un asset au chemin cassé
    # qui renvoie du HTML au lieu d'un 404 franc, ce qui transforme un fichier
    # manquant en obscure erreur de type MIME.
    # `$uri/` reste nécessaire : c'est lui qui, sur `/`, fait tomber la requête
    # sur la directive `index` ci-dessus.
    location / {
        try_files $uri $uri/ =404;
    }
}
